<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>  

<div class="video-bg">
  <video autoplay muted loop playsinline>
    <source src="./imges/WhatsApp Video 2026-02-11 at 12.09.41 PM.mp4" type="video/mp4">
  </video>
</div>

<!-- login form -->
<div class="login-box">
    <h2>Login</h2>

    <form id="loginForm">
        <input type="email" id="logEmail" placeholder="E-mail" required>
        <span id="emailError" class="error"></span>

        <input type="password" id="logPassword" placeholder="Password" required>
        <span id="passError" class="error"></span>

        <h5>create new account .... <a href="signup.html">sign up</a></h5>
        <hr>

        <button type="submit">Login</button>
    </form>
</div>

<script src="./js/login.js"></script>
</body>
</html>
